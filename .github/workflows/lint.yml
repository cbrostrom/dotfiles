name: Lint

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh + shellcheck + shfmt
        run: |
          sudo apt-get update -y
          sudo apt-get install -y zsh shellcheck
          SHFMT_VERSION=v3.14.1
          curl -fsSL -o /tmp/shfmt "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          chmod +x /tmp/shfmt
          sudo mv /tmp/shfmt /usr/local/bin/shfmt

      - name: shellcheck *.sh
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            first=$(head -1 "$f")
            [[ "$first" =~ (^#!/.*zsh|zsh$) ]] && continue
            case "$f" in
              zsh/lib/*.sh | functions/port-utils.sh) continue ;;
            esac
            shellcheck -S error "$f" || fail=1
          done < <(git ls-files '*.sh')
          exit $fail

      - name: shfmt -d *.sh
        run: |
          set -e
          files=()
          while IFS= read -r f; do
            first=$(head -1 "$f")
            [[ "$first" =~ (^#!/.*zsh|zsh$) ]] && continue
            case "$f" in
              zsh/lib/*.sh | functions/port-utils.sh) continue ;;
            esac
            files+=("$f")
          done < <(git ls-files '*.sh')
          shfmt -d -i 4 -ci "${files[@]}"

      - name: zsh -n on all *.zsh + .zshrc + .zshenv
        run: |
          set -e
          while IFS= read -r f; do
            zsh -n "$f"
          done < <(git ls-files '*.zsh' '.zshrc' '.zshenv')
