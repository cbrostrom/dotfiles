# Dotfiles Configuration
# Format: source_file:target_location:description
# Use ~ for home directory
# Use .config/ for config directory

# Shell configuration
.zshrc:~/.zshrc:Zsh configuration
.config/zsh/aliases:~/.config/zsh/aliases:Zsh aliases
.config/zsh/plugins:~/.config/zsh/plugins:Zsh plugins
.config/zsh/env:~/.config/zsh/env:Zsh environment variables

# Git configuration
.gitconfig:~/.gitconfig:Git configuration
.gitignore_global:~/.gitignore_global:Global gitignore

# Terminal configuration
.config/ghostty/config:~/.config/ghostty/config:Ghostty terminal configuration
.config/starship.toml:~/.config/starship.toml:Starship prompt configuration

# CLI tools
# .config/gh/config.yml:~/.config/gh/config.yml:GitHub CLI configuration

# ===== COMMENTED EXAMPLES FOR WEB DEVELOPMENT 2025 =====

# SSH configuration
# .ssh/config:~/.ssh/config:SSH configuration
# .ssh/id_rsa:~/.ssh/id_rsa:SSH private key
# .ssh/id_rsa.pub:~/.ssh/id_rsa.pub:SSH public key

# Modern editors
# .config/nvim/init.lua:~/.config/nvim/init.lua:Neovim Lua configuration
# .config/vscode/settings.json:~/.config/Code/User/settings.json:VS Code settings
# .config/cursor/settings.json:~/.config/Cursor/User/settings.json:Cursor settings

# Package managers
# .npmrc:~/.npmrc:NPM configuration
# .yarnrc.yml:~/.yarnrc.yml:Yarn configuration
# .pnpmrc:~/.pnpmrc:PNPM configuration

# Node.js tools
# .config/nvm/default-packages:~/.config/nvm/default-packages:NVM default packages
# .config/volta/hooks.json:~/.config/volta/hooks.json:Volta hooks

# Modern CLI tools
# .config/bat/config:~/.config/bat/config:Bat configuration
# .config/fd/ignore:~/.config/fd/ignore:Fd ignore file
# .config/ripgrep/config:~/.config/ripgrep/config:Ripgrep configuration

# Docker
# .docker/config.json:~/.docker/config.json:Docker configuration

# Cloud tools
# .config/aws/config:~/.config/aws/config:AWS configuration
# .config/gcloud/configurations/config_default:~/.config/gcloud/configurations/config_default:Google Cloud configuration

# Development tools
# .config/prettier/config.json:~/.config/prettier/config.json:Prettier configuration
# .config/eslint/eslintrc.json:~/.config/eslint/eslintrc.json:ESLint configuration
# .config/stylelint/stylelintrc.json:~/.config/stylelint/stylelintrc.json:Stylelint configuration

# Database tools
# .config/dbeaver/General/dbeaver-data-sources.xml:~/.config/dbeaver/General/dbeaver-data-sources.xml:DBeaver data sources
