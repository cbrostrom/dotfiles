# Janitor Configuration v3.1
# Location: ~/dotfiles/scripts/janitor.conf
# Sourced by: ~/dotfiles/scripts/janitor.sh
# Secrets loaded from: ~/.local-secrets (OPENCODE_API_KEY)

# AI Integration (Big Pickle via OpenCode Zen)
JANITOR_AI_ENABLED=true
JANITOR_AI_MODEL="big-pickle"
JANITOR_AI_TIMEOUT=10

# Thresholds
JANITOR_SLIPPING_THRESHOLD=20        # Days (project needs review)
JANITOR_ARCHIVE_THRESHOLD=180        # Days (auto-consolidate old files)

# Logging
JANITOR_LOG_RETENTION=7              # Days (keep last 7 days only)
