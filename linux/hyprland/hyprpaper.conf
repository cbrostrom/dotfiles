# Hyprpaper Configuration
# https://wiki.hyprland.org/Hypr-Ecosystem/hyprpaper/

# Preload wallpapers (must be done before setting)
preload = /usr/share/wallpapers/cachyos-wallpapers/Dracula.png

# Set wallpaper for all monitors
# Format: wallpaper = monitor,path
# Use empty string for monitor to apply to all
wallpaper = ,/usr/share/wallpapers/cachyos-wallpapers/Dracula.png

# Disable IPC (set to true if you want to change wallpaper on-the-fly)
ipc = on

# Splash (disable the text)
splash = false
