# Hyprland Configuration
# https://wiki.hypr.land/Configuring/

# ==================
# MONITOR CONFIG
# ==================
# Monitors from existing configuration
monitor=,preferred,auto,auto

monitor = , preferred,auto,auto

# ==================
# STARTUP APPS
# ==================
# Load plugins BEFORE anything else
exec-once = hyprpm reload -n
exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user start hyprland-session.target
# Clipboard history for DMS
exec-once = wl-paste --watch cliphist store

# ==================
# INPUT CONFIG
# ==================
input {
    kb_layout = dk
    kb_variant =
    kb_model =
    kb_options =
    # Note: Caps Lock -> Hyper is handled by keyd (see /etc/keyd/default.conf)
    numlock_by_default = true
    follow_mouse = 0
}

# ==================
# CURSOR CONFIG
# ==================
cursor {
    no_warps = true
    no_hardware_cursors = 2
    sync_gsettings_theme = true
    warp_on_change_workspace = 2
    enable_hyprcursor = true
}



# ==================
# GENERAL LAYOUT
# ==================
general {
    gaps_in = 5
    gaps_out = 5
    border_size = 2

    layout = scrolling
}

# ==================
# PLUGIN CONFIG
# ==================
plugin {
    hyprscrolling {
        enabled = true # Enable hyprscrolling plugin
        column_width = 0.5
        fullscreen_on_one_column = true
        focus_fit_method = 0
        follow_focus = true
        explicit_column_widths = 0.333, 0.5, 1.0
    }
}


# ==================
# DECORATION
# ==================
decoration {
    rounding = 12

    active_opacity = 1.0
    inactive_opacity = 0.9

    shadow {
        enabled = true
        range = 30
        render_power = 5
        offset = 0 5
        color = rgba(00000070)
    }
}

# ==================
# ANIMATIONS
# ==================
animations {
    enabled = true

    animation = windowsIn, 1, 3, default
    animation = windowsOut, 1, 3, default
    animation = workspaces, 1, 5, default
    animation = windowsMove, 1, 4, default
    animation = fade, 1, 3, default
    animation = border, 1, 3, default
}

# ==================
# LAYOUTS
# ==================
dwindle {
    preserve_split = true
}

master {
    mfact = 0.5
}

# ==================
# MISC
# ==================
misc {
    disable_hyprland_logo = false
    disable_splash_rendering = false
    mouse_move_enables_dpms = true
    enable_anr_dialog = true
    vrr = 1
    # Fix NVIDIA wake from sleep/DPMS issues
    vfr = false
}

# ==================
# XWAYLAND CONFIG
# ==================
xwayland {
  enabled = true
  force_zero_scaling = true
}

# ==================
# WINDOW RULES
# ==================
# DMS layer rules - disable animations for DMS layers
layerrule {
  name = dms_bar_noanim
  no_anim = on
  match:namespace = dms:bar
}
layerrule {
  name = dms_dock_noanim
  no_anim = on
  match:namespace = dms:dock
}
layerrule {
  name = quickshell_noanim
  no_anim = on
  match:namespace = quickshell
}

# ==================
# APPLICATION WORKSPACE ASSIGNMENTS
# ==================
windowrule {
  name = ghostty_workspace
  match:class = ^(com\.mitchellh\.ghostty)$
  workspace = 1
}
windowrule {
  name = vivaldi_workspace
  match:class = ^(vivaldi-stable)$
  workspace = 2
}
windowrule {
  name = cursor_workspace
  match:class = ^(cursor)$
  workspace = 3
}

# ==================
# FLOATING WINDOW RULES
# ==================
# File dialogs should always float and be moveable
windowrule {
  name = file_dialog_float
  match:class = ^(xdg-desktop-portal-gtk)$
  float = on
  size = 1200 800
  center = on
  move = on
  pin = off
}
windowrule {
  name = file_picker_float
  match:title = ^(Open File)$
  float = on
  move = on
}
windowrule {
  name = file_saver_float
  match:title = ^(Save File)$
  float = on
  move = on
}
windowrule {
  name = folder_picker_float
  match:title = ^(Open Folder)$
  float = on
  move = on
}
windowrule {
  name = save_as_float
  match:title = ^(Save As)$
  float = on
  move = on
}

# ==================
# COMMUNICATION APPS -> WORKSPACE 4 (COMMS)
# ==================
# Slack
windowrule {
  name = slack_comms
  match:class = ^(Slack)$
  workspace = 4 silent
}
windowrule {
  name = slack_lowercase_comms
  match:class = ^(slack)$
  workspace = 4 silent
}

# Microsoft Teams
windowrule {
  name = teams_comms
  match:class = ^(teams-for-linux)$
  workspace = 4 silent
}
windowrule {
  name = teams_preview_comms
  match:class = ^(Microsoft Teams - Preview)$
  workspace = 4 silent
}

# Outlook
windowrule {
  name = outlook_comms
  match:class = ^(outlook-for-linux)$
  workspace = 4 silent
}
windowrule {
  name = outlook_alt_comms
  match:class = ^(Outlook)$
  workspace = 4 silent
}

# Discord
windowrule {
  name = discord_comms
  match:class = ^(discord)$
  workspace = 4 silent
}
windowrule {
  name = discord_cap_comms
  match:class = ^(Discord)$
  workspace = 4 silent
}

# Betterbird / Thunderbird
windowrule {
  name = betterbird_comms
  match:class = ^(eu\.betterbird\.Betterbird)$
  workspace = 4 silent
}
windowrule {
  name = thunderbird_comms
  match:class = ^(thunderbird)$
  workspace = 4 silent
}
windowrule {
  name = thunderbird_cap_comms
  match:class = ^(Thunderbird)$
  workspace = 4 silent
}

# ==================
# GAMING APPS -> WORKSPACE 5 (GAMING)
# ==================
# Steam Friends/Chat windows should float (must be BEFORE main steam rule)
windowrule {
  name = steam_friends_float
  match:title = ^(Friends List)$
  float = on
  size = 400 700
}
windowrule {
  name = steam_chat_float
  match:title = ^(Steam - )
  float = on
  size = 500 600
}

# Steam main window (catch-all for steam class)
windowrule {
  name = steam_gaming
  match:class = ^(steam)$
  workspace = 5 silent
}

# Steam game windows (most games use steamwebhelper or game title)
windowrule {
  name = steam_game_gaming
  match:class = ^(steamwebhelper)$
  workspace = 5 silent
}

# Lutris
windowrule {
  name = lutris_gaming
  match:class = ^(lutris)$
  workspace = 5 silent
}
windowrule {
  name = lutris_cap_gaming
  match:class = ^(Lutris)$
  workspace = 5 silent
}

# Heroic Games Launcher (Epic, GOG)
windowrule {
  name = heroic_gaming
  match:class = ^(heroic)$
  workspace = 5 silent
}
windowrule {
  name = heroic_cap_gaming
  match:class = ^(Heroic)$
  workspace = 5 silent
}

# Bottles (Windows games)
windowrule {
  name = bottles_gaming
  match:class = ^(bottles)$
  workspace = 5 silent
}
windowrule {
  name = bottles_cap_gaming
  match:class = ^(Bottles)$
  workspace = 5 silent
}

# ==================
# GAMING OPTIMIZATIONS
# ==================
# Gaming windows should have no rounding, full opacity for performance
windowrule {
  name = steam_game_optimize
  match:class = ^(steamwebhelper)$
  rounding = 0
  opacity = 1.0 1.0
}

# Fullscreen games should have immediate rendering (no animations)
windowrule {
  name = fullscreen_game_optimize
  match:fullscreen = 1
  workspace = 5
  immediate = on
  rounding = 0
}

# ==================
# MEDIA APPS -> WORKSPACE 6 (MEDIA)
# ==================
# Spotify
windowrule {
  name = spotify_media
  match:class = ^(spotify)$
  workspace = 6 silent
}
windowrule {
  name = spotify_cap_media
  match:class = ^(Spotify)$
  workspace = 6 silent
}

# Other music players
windowrule {
  name = vlc_media
  match:class = ^(vlc)$
  workspace = 6 silent
}
windowrule {
  name = mpv_media
  match:class = ^(mpv)$
  workspace = 6 silent
}

# ==================
# WORKSPACE RULES
# ==================
# Default workspace assignments to monitors
# Dell (DP-4) = Workspace 1, 2, 4 (comms)
# ASUS (DP-1) = Workspace 3, 5 (gaming), 6 (media)
workspace = 1, monitor:DP-4, default:true
workspace = 2, monitor:DP-4
workspace = 3, monitor:DP-1, default:true
workspace = 4, monitor:DP-4, name:comms, default:false, persistent:true
workspace = 5, monitor:DP-1, name:gaming, default:false, persistent:true
workspace = 6, monitor:DP-1, name:media, default:false, persistent:true
workspace = 7, monitor:DP-1
workspace = 8, monitor:DP-1
workspace = 9, monitor:DP-1

source = ./dms/colors.conf
source = ./dms/outputs.conf
source = ./dms/layout.conf
source = ./dms/cursor.conf
source = ./dms/binds.conf
source = ./dms/hyper-binds.conf
