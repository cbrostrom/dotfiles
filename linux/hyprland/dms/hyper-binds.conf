# =============================================================================
# HYPER KEY BINDINGS (Caps Lock as Hyper via keyd)
# =============================================================================
# Caps Lock is remapped to Ctrl+Alt+Super via keyd daemon
# Config: /etc/keyd/default.conf
# 
# Philosophy:
#   Hyper alone        = Visual/Navigation (tiling, switch workspace, launch apps)
#   Hyper + Shift      = Manipulation (move window to workspace, resize columns)
#
# Bindings:
#   Caps + Left/Right       = Move window left/right (column navigation)
#   Caps + Up/Down          = Move window up/down (within column)
#   Caps + ,                = Move layout left by one column
#   Caps + .                = Move layout right by one column
#   Caps + Shift + Up       = Make column fullscreen (100%)
#   Caps + Shift + Down     = Make column normal (50%)
#   Caps + T                = Launch Ghostty terminal
#   Caps + W                = Launch Vivaldi browser
#   Caps + C                = Launch Cursor editor
#   Caps + Q                = Close active window
#   Caps + 1-9              = Switch to workspace 1-9 on active monitor
#   Caps + Shift + 1-9      = Move window to specific workspace 1-9
# =============================================================================

# === Caps Lock + Arrows: Move focus between windows (with auto-scroll) ===
bind = CTRL ALT SUPER, left, layoutmsg, focus l
bind = CTRL ALT SUPER, right, layoutmsg, focus r
bind = CTRL ALT SUPER, up, layoutmsg, focus u
bind = CTRL ALT SUPER, down, layoutmsg, focus d

# === Caps Lock + Shift + Left/Right: Move window position ===
bind = CTRL ALT SUPER SHIFT, left, layoutmsg, movewindowto l
bind = CTRL ALT SUPER SHIFT, right, layoutmsg, movewindowto r

# === Caps Lock + , / . : Move layout by column ===
bind = CTRL ALT SUPER, comma, layoutmsg, move -col
bind = CTRL ALT SUPER, period, layoutmsg, move +col

# === Caps Lock + Shift + Up/Down: Resize current column ===
bind = CTRL ALT SUPER SHIFT, up, layoutmsg, colresize 1.0
bind = CTRL ALT SUPER SHIFT, down, layoutmsg, colresize 0.5

# === Caps Lock + Letters: Launch applications & window management ===
bind = CTRL ALT SUPER, T, exec, ghostty
bind = CTRL ALT SUPER, W, exec, vivaldi-stable
bind = CTRL ALT SUPER, C, exec, cursor
bind = CTRL ALT SUPER, Q, killactive

# === Caps Lock + Numbers: Switch to workspace on active monitor ===
bind = CTRL ALT SUPER, 1, workspace, 1
bind = CTRL ALT SUPER, 2, workspace, 2
bind = CTRL ALT SUPER, 3, workspace, 3
bind = CTRL ALT SUPER, 4, workspace, 4
bind = CTRL ALT SUPER, 5, workspace, 5
bind = CTRL ALT SUPER, 6, workspace, 6
bind = CTRL ALT SUPER, 7, workspace, 7
bind = CTRL ALT SUPER, 8, workspace, 8
bind = CTRL ALT SUPER, 9, workspace, 9

# === Caps Lock + Shift + Numbers: Move window to specific workspace ===
bind = CTRL ALT SUPER SHIFT, 1, movetoworkspace, 1
bind = CTRL ALT SUPER SHIFT, 2, movetoworkspace, 2
bind = CTRL ALT SUPER SHIFT, 3, movetoworkspace, 3
bind = CTRL ALT SUPER SHIFT, 4, movetoworkspace, 4
bind = CTRL ALT SUPER SHIFT, 5, movetoworkspace, 5
bind = CTRL ALT SUPER SHIFT, 6, movetoworkspace, 6
bind = CTRL ALT SUPER SHIFT, 7, movetoworkspace, 7
bind = CTRL ALT SUPER SHIFT, 8, movetoworkspace, 8
bind = CTRL ALT SUPER SHIFT, 9, movetoworkspace, 9
