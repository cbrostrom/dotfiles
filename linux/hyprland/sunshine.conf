# Sunshine configuration for Hyprland
# Place this in ~/.config/sunshine/sunshine.conf

################
### HARDWARE ###
################

# GPU adapter (NVIDIA card)
adapter_name = /dev/dri/card1

# Hardware encoder (NVENC for NVIDIA)
encoder = nvenc


#################
### DISPLAY ###
#################

# Output to capture (HDMI dummy)
output_name = HDMI-A-1

# Capture method (KMS works best on Hyprland/Wayland)
capture = kms


##############
### VIDEO ###
##############

# Enable HEVC (H.265) support
hevc_mode = 1

# Enable AV1 support
av1_mode = 1

# NVENC preset (1 = P1/fastest, 7 = P7/slowest)
nvenc_preset = 1

# Two-pass encoding (disabled for lower latency)
nvenc_twopass = disabled

# Quantization parameter (lower = better quality, higher bitrate)
qp = 32

# CAVLC for H.264 (0 = CABAC, faster decode)
nvenc_h264_cavlc = 0


##############
### AUDIO ###
##############

# Audio sink (auto-detect)
audio_sink = auto


################
### NETWORK ###
################

# Sunshine port
port = 47989

# Server name (shows up in Moonlight)
sunshine_name = MonsterBro

# UPnP for automatic port forwarding
upnp = on

# Forward error correction
fec_percentage = 5


####################
### PERFORMANCE ###
####################

# Minimum threads for encoding
min_threads = 1

# Minimum FPS target (0 = no minimum)
minimum_fps_target = 0


###############
### LOGGING ###
###############

# Log level (verbose, debug, info, warning, error, fatal, none)
min_log_level = warning
