# PI global hooks managed by the `pi` Stow package.
# Installed at ~/.pi/agent/hook/hooks.yaml.
#
# Compatibility: pi-yaml-hooks 2026.6.x, PI 0.84.x (run /hooks-validate)
#
# To verify: inside PI run /hooks-validate then /hooks-status
# To disable: remove or comment out individual hook entries

hooks:

  # Session-start readiness notify → pane-notify extension (pi-extensions).
  # Re-enable here only if pane-notify is removed.

  # Idle: daily Higgins digest/prune/compact per project slug, detached.
  # Shared with Claude/Cursor SessionEnd (~/.agents/hooks/higgins-tidy, same stamps).
  # Does NOT auto-save narrative context — that requires agent judgement (.remember).
  - id: idle-kb-tidy
    event: session.idle
    actions:
      - bash: "$HOME/.agents/hooks/higgins-tidy"

  # Policy gate: mechanical output-style rules (time estimates, em-dashes,
  # filler openers, filler words). detect scans the last assistant text at idle;
  # consume injects a correction note as system context on the next submission
  # (one-shot). Shared with Cursor (~/.agents/hooks). All failures no-op.
  - id: style-gate-detect
    event: session.idle
    actions:
      - bash: "$HOME/.agents/hooks/style-gate pi detect"

  - id: style-gate-correct
    event: user.prompt.submit
    actions:
      - bash: "$HOME/.agents/hooks/style-gate pi consume"

  # Before bash: one guard process for every bash call (shared with Claude and Cursor).
  # Catastrophic rm, raw docker on linuxbro (Dockhand MCP only), git push whitelist +
  # release/publish block (push-guard.sh), unbounded ssh/wsl (ssh-guard.sh). The
  # push and ssh checks only start when the command mentions them.
  # pi has no built-in permissions engine; this is the real enforcement.
  - id: bash-guard
    event: tool.before.bash
    actions:
      - bash: "$HOME/.agents/hooks/bash-guard pi"

