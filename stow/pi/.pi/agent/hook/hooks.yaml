# PI global hooks managed by the `pi` Stow package.
# Installed at ~/.pi/agent/hook/hooks.yaml.
#
# Compatibility: pi-yaml-hooks 2026.6.x, PI 0.84.x (run /hooks-validate)
#
# To verify: inside PI run /hooks-validate then /hooks-status
# To disable: remove or comment out individual hook entries

hooks:
  # Paseo integration: report turn boundaries to the Paseo daemon timeline.
  # session.created -> session_start (startup/new), session.idle -> agent_end.
  # No-op outside Paseo (resolver exits empty when no ~/.paseo agent record matches).
  # All failures are swallowed: this hook must never block or error the agent loop.
  - id: paseo-hooks-bridge
    event: session.created
    actions:
      - bash: |
          id=$("$HOME/.pi/agent/scripts/paseo-agent-id.sh" || true)
          [[ -n "$id" ]] && paseo hooks "$id" turn_start >/dev/null 2>&1 || true
  - id: paseo-hooks-bridge-idle
    event: session.idle
    actions:
      - bash: |
          id=$("$HOME/.pi/agent/scripts/paseo-agent-id.sh" || true)
          [[ -n "$id" ]] && paseo hooks "$id" turn_end >/dev/null 2>&1 || true

  # Session-start readiness notify → pane-notify extension (pi-extensions).
  # Re-enable here only if pane-notify is removed.

  # Idle: auto-prune + compact
  # Fires after turn completion with no pending messages.
  # Silently runs higgins prune + compact to keep brains tidy.
  # Does NOT auto-save narrative context — that requires agent judgement (.remember).
  - id: idle-kb-tidy
    event: session.idle
    actions:
      - bash: |
          # Determine slug from cwd (mirrors higgins slug resolution)
          if git rev-parse --git-dir >/dev/null 2>&1; then
            SLUG="$(basename "$(git rev-parse --show-toplevel 2>/dev/null)")"
          else
            SLUG="$(basename "$PWD")"
          fi
          higgins prune "$SLUG" 2>/dev/null || true
          higgins compact "$SLUG" 2>/dev/null || true
          # DuckDB projection freshness (go higgins): rebuild if the projection is
          # stale vs its ledger shards. Rebuild is cheap-ish; guard with () || true
          # so a missing binary/CLI never blocks the hook.
          if higgins duckdb status 2>/dev/null | grep -q '"stale": true'; then
            higgins duckdb rebuild >/dev/null 2>&1 || true
          fi

  # Policy gate: no time estimates (minutes/hours) in assistant messages.
  # detect scans the last assistant text at idle; consume injects a correction
  # note as system context on the next submission (one-shot). All failures no-op.
  - id: time-estimate-gate-detect
    event: session.idle
    actions:
      - bash: "$HOME/.pi/agent/scripts/time-estimate-gate.sh detect"

  - id: time-estimate-gate-correct
    event: user.prompt.submit
    actions:
      - bash: "$HOME/.pi/agent/scripts/time-estimate-gate.sh consume"

  # File changed: aislop quality check
  # Runs after PI writes/edits code files. aislop --pi checks score regression.
  # Exit code 2 would block (aislop hook pi uses PI hook protocol).
  - id: aislop-after-edit
    event: file.changed
    conditions:
      - matchesCodeFiles
    actions:
      - bash: "aislop hook pi"

  # Before bash: catastrophic filesystem guard
  # Blocks rm -rf on root/home — defence-in-depth beside pi-permissions.jsonc.
  # Push/publish/release/merge: pi-permissions.jsonc only (no duplicate hook patterns).
  - id: guard-destructive
    event: tool.before.bash
    actions:
      - bash: |
          payload=$(cat)
          if command -v jq >/dev/null 2>&1; then
            cmd=$(printf '%s' "$payload" | jq -r '.tool_args.command // empty' 2>/dev/null)
          else
            cmd="$payload"
          fi
          [[ -z "$cmd" ]] && exit 0
          if echo "$cmd" | grep -qE 'rm -rf (/[^/]|~|/home|/Users)'; then
            echo "[pi-guard] Blocked catastrophic rm: $cmd" >&2
            exit 2
          fi

  # Before bash: context-mode tool-preference guard
  # RPC-children-only: terminal pi sessions already get the same enforcement from
  # the context-mode-enforcer extension; running both double-prompts the agent.
  # pi-paseo exports PI_RPC_CHILD=1; without it (terminal session) this guard no-ops.
  - id: guard-context-mode
    event: tool.before.bash
    actions:
      - bash: |
          [[ "${PI_RPC_CHILD:-}" == "1" ]] || exit 0
          payload=$(cat)
          cmd=$(printf '%s' "$payload" | jq -r '.tool_args.command // empty' 2>/dev/null)
          [[ -z "$cmd" ]] && exit 0

          # Allow-list: trivial, known-short, no-derivation commands pass straight through
          echo "$cmd" | grep -qE '^\s*(git (status|branch|diff --stat|log -1)|pwd|whoami|echo |which |ls( -la?)?\s*$)' && exit 0

          # Fast/bounded lookups pass straight through (no context-mode redirect):
          # mdfind is indexed (seconds); chains whose output is line-capped by
          # head/tail/wc cannot flood context. NOTE: a recursive scan (find,
          # grep -r/-R, ls -R) is NOT made safe by piping into head — those cap
          # bytes written, not run time — so recursive scans never hit this escape.
          echo "$cmd" | grep -q '\bmdfind\b' && exit 0
          if ! echo "$cmd" | grep -qE '\b(find|ls -R|tree|du)\b|\bgrep +-[rR]' \
             && echo "$cmd" | grep -qE '\|\s*(head|tail|wc)\b'; then
            exit 0
          fi
          reason=""
          chained=$(echo "$cmd" | grep -oE '&&|;|\|' | wc -l | tr -d ' ')
          [[ "$chained" -ge 3 ]] && reason="3+ chained commands — use ctx_batch_execute"
          echo "$cmd" | grep -qE '\b(cat|head|tail|ls -R|find|grep -r|grep -R)\b' && [[ -z "$reason" ]] && reason="file/dir inspection command — use ctx_execute_file or ctx_batch_execute"
          echo "$cmd" | grep -qE '\b(curl|docker (ps|logs|inspect)|kubectl get|npm (ls|outdated)|git log -p|git diff)\b' && [[ -z "$reason" ]] && reason="likely-large output — use ctx_execute or ctx_batch_execute"

          if [[ -n "$reason" ]]; then
            echo "[context-mode-guard] $reason: $cmd" >&2
            exit 2
          fi

  # Before ctx tools: runaway-scan guard (reciprocal of guard-context-mode).
  # The bash-side guards push the model into context-mode's ctx tools, but nothing
  # inspected what enters them: a grep -rl over ~/.paseo or ~/Library/Application
  # Support inside ctx_batch_execute with no `timeout` sat silent for 15+ minutes
  # (context-mode intentionally fires no default timer off-antigravity, Issue #406 —
  # it trusts an MCP host RPC timeout that Paseo does not enforce). Rule: any
  # recursive filesystem scan (grep -r/-R, find, fd as walker, rg without a
  # --max-time cap) inside an RPC-child ctx tool REQUIRES an explicit `timeout`.
  # pi-paseo exports PI_RPC_CHILD=1; terminal sessions exit here (the
  # context-mode-enforcer extension covers them) so we never double-prompt.
  - id: guard-ctx-runtimeout
    event: tool.before.ctx_batch_execute
    actions:
      - bash: |
          [[ "${PI_RPC_CHILD:-}" == "1" ]] || exit 0
          payload=$(cat)
          code=$(printf '%s' "$payload" | jq -r '[.tool_args.commands[]?.command // empty] | join("\n")' 2>/dev/null)
          [[ -z "$code" ]] && exit 0
          case "$code" in *grep\ -[rR]*|*find\ *|*tree\ *|*du\ *) ;; *) exit 0 ;; esac
          has_timeout=$(printf '%s' "$payload" | jq -r '.tool_args.timeout != null' 2>/dev/null)
          if [[ "$has_timeout" != "true" ]]; then
            echo "[ctx-guard] recursive filesystem scan (grep -r/-R|find) inside ctx_batch_execute without a timeout — add 'timeout: 120000' to the call, or bound the scan (rg --max-time 10 / --max-depth 3, scoped path). Bytes-capped (head/tail) does NOT bound run time." >&2
            exit 2
          fi

  - id: guard-ctx-execute-runtimeout
    event: tool.before.ctx_execute
    actions:
      - bash: |
          [[ "${PI_RPC_CHILD:-}" == "1" ]] || exit 0
          payload=$(cat)
          code=$(printf '%s' "$payload" | jq -r '.tool_args.code // empty' 2>/dev/null)
          [[ -z "$code" ]] && exit 0
          case "$code" in *grep\ -[rR]*|*find\ *|*tree\ *|*du\ *) ;; *) exit 0 ;; esac
          has_timeout=$(printf '%s' "$payload" | jq -r '.tool_args.timeout != null' 2>/dev/null)
          if [[ "$has_timeout" != "true" ]]; then
            echo "[ctx-guard] recursive filesystem scan (grep -r/-R|find) inside ctx_execute without a timeout — pass 'timeout: 120000', or bound the scan (rg --max-time 10 / --max-depth 3, scoped path). Bytes-capped (head/tail) does NOT bound run time." >&2
            exit 2
          fi
