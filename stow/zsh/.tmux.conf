# tmux configuration
# Moshi-compatible: MOSHI_CLIENT signal propagated and status cleared when active

set -g history-limit 100000
set -g mouse on
set -g set-titles on
set -g set-titles-string "#I: #W"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Use C-a as prefix (less finger-strain than C-b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Split panes with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Propagate MOSHI_CLIENT into tmux sessions
set-option -ga update-environment " MOSHI_CLIENT"

# Clear status regions when running under Moshi (swipe detection requires clean status bar)
if-shell '[ -n "$MOSHI_CLIENT" ]' {
  set -g status-left ''
  set -g status-right ''
}
