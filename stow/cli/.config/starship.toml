# =============================================================================
# Starship prompt configuration for web development
# Modern, fast, and informative prompt
# =============================================================================

# Warm Nordic color palette
# #e25822 user
# #e76f51 dir
# #f4a261 git/branch
# #f6aa1c package/time
# #e63946 error/status
# #4c566a version/lang
# #5e81ac doc
# #6272a4 time

# =============================================================================
# GLOBAL
# =============================================================================
command_timeout = 2000

format = """$hostname$directory$git_branch$git_status$package$nodejs$cmd_duration$fill$env_var
$time$character"""

# =============================================================================
# PROMPT CHARACTER
# =============================================================================
[character]
success_symbol = " [➜](#e25822 bold) "
error_symbol = " [✗](#e63946 bold) "

# =============================================================================
# DIRECTORY
# =============================================================================
[directory]
truncation_length = 4
truncation_symbol = ""
truncate_to_repo = true
format = "[ $path]($style) "
style = "#e76f51 bold"

# =============================================================================
# FILL — pushes PWD to right edge of line 1
# =============================================================================
[fill]
symbol = " "

# =============================================================================
# FULL PATH (right side of line 1 — mouse-selectable for copy)
# =============================================================================
[env_var.PWD]
format = "[$env_value]($style)"
style = "#4c566a dimmed"
variable = "PWD"

# =============================================================================
# GIT INTEGRATION
# =============================================================================
[git_branch]
format = '\[ [$symbol$branch ]($style)\] '
symbol = " "
style = "#f4a261 bold"

[git_status]
format = '\[ [$ahead_behind$staged$modified$untracked$stashed]($style)\] '
style = "#f4a261 bold"

ahead = "⇡$count "
behind = "⇣$count "
diverged = "⇕⇡$ahead_count⇣$behind_count "
untracked = "🤷$count "
stashed = "📦$count "
modified = "📝$count "
staged = "++$count "

# Removed: conflicted, renamed, deleted (rarely needed, expensive)
conflicted = ""
renamed = ""
deleted = ""

# =============================================================================
# LANGUAGE VERSIONS
# =============================================================================
[nodejs]
format = '\[ [$symbol$version ]($style)\] '
symbol = "󰎙 "
style = "#4c566a bold"
detect_extensions = ["js", "mjs", "cjs", "ts", "jsx", "tsx"]
detect_files = ["package.json", ".nvmrc", ".node-version"]
# Skip node_modules folder scan (expensive)
detect_folders = []

[package]
format = '\[ [$symbol$version ]($style)\] '
symbol = "󰏗 "
style = "#f6aa1c bold"

# =============================================================================
# SYSTEM INFORMATION
# =============================================================================
[cmd_duration]
format = '\[ [⏱ $duration ]($style)\] '
min_time = 2000
style = "#f6aa1c bold"

# =============================================================================
# TIME & UTILITY
# =============================================================================
[time]
format = '\[ [$time ]($style)\] '
style = "#6272a4 bold"
disabled = false

# =============================================================================
# HOSTNAME — SSH-only to reduce noise on local machine
# =============================================================================
[hostname]
ssh_only = false
format = "[ $hostname ]($style)"
style = "#5e81ac bold"
trim_at = ".local"
disabled = false

# =============================================================================
# DISABLED — Cloud tools you're not using daily
# Enable on demand: export STARSHIP_AWS=1 / STARSHIP_K8S=1 / STARSHIP_DOCKER=1
# =============================================================================
[memory_usage]
disabled = true  # Polls system every prompt — enable when debugging

[aws]
format = '\[ [$symbol$profile$region ]($style)\] '
symbol = " "
style = "#e25822 bold"
disabled = true

[kubernetes]
format = '\[ [$symbol$context ]($style)\] '
symbol = " "
style = "#e76f51 bold"
disabled = true

[docker_context]
format = '\[ [$symbol$context ]($style)\] '
symbol = "󰡨 "
style = "#f6aa1c bold"
disabled = false

[terraform]
disabled = true

[gcloud]
disabled = true

[golang]
disabled = true

[rust]
disabled = true

[python]
disabled = true

[conda]
disabled = true

[battery]
disabled = true
