# Ghostty Terminal Configuration
# This file contains all settings for the Ghostty terminal emulator
# For more information, see: https://ghostty.dev/docs/configuration

# =============================================================================
# APPEARANCE & THEMING
# =============================================================================

# Font configuration
font-family = "Hack Nerd Font Mono"

# Window appearance
fullscreen = false
window-theme = "dark"
window-padding-balance = true
window-save-state = "always"
macos-titlebar-style = "transparent"
window-colorspace = "display-p3"

# Color scheme and palette
theme = "custom"
background = "#131313"
foreground = "#d6dbe5"
selection-background = "#3a4555"
selection-foreground = "#ffffff"
cursor-color = "#b9b9b9"

# Color palette (16 colors)
palette = [
    "#1f1f1f", # 0: black
    "#f81118", # 1: red
    "#2dc55e", # 2: green
    "#ecba0f", # 3: yellow
    "#2a84d2", # 4: blue
    "#4e5ab7", # 5: magenta
    "#1081d6", # 6: cyan
    "#d6dbe5", # 7: white
    "#d6dbe5", # 8: bright black
    "#de352e", # 9: bright red
    "#1dd361", # 10: bright green
    "#f3bd09", # 11: bright yellow
    "#1081d6", # 12: bright blue
    "#5350b9", # 13: bright magenta
    "#0f7ddb", # 14: bright cyan
    "#ffffff", # 15: bright white
]

# =============================================================================
# BEHAVIOR & INTEGRATION
# =============================================================================

# Shell and working directory
working-directory = "home"
shell-integration = "zsh"

# Clipboard settings
clipboard-read = "allow"
clipboard-write = "allow"

# Visual effects
custom-shader-animation = "always"
adjust-cell-height = "35%"

# Performance and rendering
vsync = true
gpu-acceleration = true

# Mouse behavior
mouse-hide-while-typing = true
mouse-scroll-multiplier = 2

# macOS specific settings
macos-option-as-alt = "right"

# =============================================================================
# KEYBINDINGS
# =============================================================================

# All keybindings in an array format
keybind = [
    # Configuration management
    "cmd+s>r=reload_config",
    "cmd+s>x=close_surface",

    # Window management
    "cmd+s>n=new_window",
    "cmd+s>w=close_window",
    "cmd+s>f=toggle_fullscreen",

    # Tab management
    "cmd+s>t=new_tab",
    "cmd+s>shift+l=next_tab",
    "cmd+s>shift+h=previous_tab",
    "cmd+s>comma=move_tab:-1",
    "cmd+s>period=move_tab:1",
    "cmd+s>shift+w=close_tab",

    # Split management
    "cmd+s>v=new_split:right",
    "cmd+s>h=new_split:down",
    "cmd+s>shift+v=new_split:left",
    "cmd+s>shift+h=new_split:up",
    "cmd+s>shift+o=close_split",

    # Navigation
    "cmd+s>shift+j=next_split",
    "cmd+s>shift+k=previous_split",
]
