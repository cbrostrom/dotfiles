# defender-exclusions.conf
# Microsoft Defender exclusions for macOS work machine.
# Read by ~/dotfiles/defender-exclusions.sh — run it to apply.
#
# Format:
#   folder   /absolute/path     — exclude a directory tree
#   folder   ~/tilde/path       — ~ is expanded to $HOME
#   ext      map                — exclude a file extension (no leading dot)
#
# Lines starting with # or blank lines are ignored.
# Paths that don't exist on disk are silently skipped.

# ── Package managers & language runtimes ─────────────────────────────────────

folder   /opt/homebrew              # Homebrew (Apple Silicon) — thousands of binaries
folder   ~/.bun                     # Bun runtime + package cache
folder   ~/.nvm                     # Node Version Manager
folder   ~/.cargo                   # Rust toolchain + compiled artifacts
folder   ~/.npm                     # npm global cache

# ── IDE & AI tooling ─────────────────────────────────────────────────────────

folder   ~/.cursor                  # Cursor IDE extensions + workspace caches
folder   ~/.claude                  # Claude agent config
folder   ~/.codex                   # Codex agent skills
folder   ~/.agents                  # Agent configs
folder   ~/.agent-browser           # Agent browser tool

# ── Dev tool config & local binaries ─────────────────────────────────────────

folder   ~/.local                   # Local executables (herdr, etc.)
folder   ~/.config                  # XDG config for CLI tools
folder   ~/.orbstack                # OrbStack VM images + containers

# ── Project & data directories ───────────────────────────────────────────────

folder   ~/Projects                 # All local project repos
folder   ~/Clients                  # Client work
folder   ~/dotfiles                 # Dotfiles repo
folder   ~/Vaults/Brain             # Obsidian vault

# ── Cloud storage ────────────────────────────────────────────────────────────

folder   ~/Library/CloudStorage/Dropbox   # Dropbox sync

# ── macOS system caches ───────────────────────────────────────────────────────

folder   ~/Library/Caches           # App caches — large, high write rate
folder   ~/Library/Developer        # Xcode derived data + simulators

# ── File extensions (build artifacts & data files) ───────────────────────────

ext      map                        # JS/CSS source maps — large, generated on build
ext      log                        # Log files
ext      lock                       # Lockfiles (package-lock.json, yarn.lock, Cargo.lock)
ext      sqlite                     # SQLite databases
ext      sqlite3                    # SQLite databases (alternate extension)
ext      db                         # Generic local databases
ext      tmp                        # Temp files
ext      temp                       # Temp files (alternate extension)
