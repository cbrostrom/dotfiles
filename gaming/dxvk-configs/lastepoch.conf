# DXVK Config for Last Epoch
# Helps with VRAM usage issues after patch 1.2

# Adjust based on your GPU VRAM:
# 4GB card:  dxgi.maxDeviceMemory = 3072
# 6GB card:  dxgi.maxDeviceMemory = 4096
# 8GB card:  dxgi.maxDeviceMemory = 6144
# 12GB card: dxgi.maxDeviceMemory = 10240

dxgi.maxDeviceMemory = 8192
dxgi.maxSharedMemory = 8192
