# DXVK Config for Diablo 4 (AMD Cards)
# Optimized for AMD GPUs with ACO shader compiler

# Adjust based on your GPU VRAM:
# 6GB card:  dxgi.maxDeviceMemory = 4096
# 8GB card:  dxgi.maxDeviceMemory = 6144
# 12GB card: dxgi.maxDeviceMemory = 10240
# 16GB card: dxgi.maxDeviceMemory = 14336

dxgi.maxDeviceMemory = 10240
dxgi.maxSharedMemory = 2048

[Diablo IV.exe]
dxvk.maxChunkSize = 4
