# DXVK Config for Diablo 4 (NVIDIA Cards)
# Fixes VRAM leaks and memory issues
#
# Place this file at:
# ~/.local/share/Steam/steamapps/common/Diablo IV/dxvk.conf

# Optimized for RTX 2070 Super (8GB VRAM)
# Leaves ~2GB headroom for system/driver overhead
dxgi.maxDeviceMemory = 6144
dxgi.maxSharedMemory = 2048

# For other NVIDIA cards, adjust based on VRAM:
# 6GB card:  dxgi.maxDeviceMemory = 4096
# 8GB card:  dxgi.maxDeviceMemory = 6144  (this setting)
# 12GB card: dxgi.maxDeviceMemory = 10240
# 16GB card: dxgi.maxDeviceMemory = 14336
# 24GB card: dxgi.maxDeviceMemory = 20480

[Diablo IV.exe]
dxvk.maxChunkSize = 4
