# DXVK Config for Diablo 4 (NVIDIA Cards)
# Fixes VRAM leaks and memory issues
#
# Place this file at:
# ~/.local/share/Steam/steamapps/common/Diablo IV/dxvk.conf

# Adjust based on your GPU VRAM:
# 8GB card:  dxgi.maxDeviceMemory = 6144
# 12GB card: dxgi.maxDeviceMemory = 10240
# 16GB card: dxgi.maxDeviceMemory = 14336
# 24GB card: dxgi.maxDeviceMemory = 20480

dxgi.maxDeviceMemory = 14336
dxgi.maxSharedMemory = 2048

[Diablo IV.exe]
dxvk.maxChunkSize = 4
