# Game Launch Wrapper - Presets Configuration
#
# Define presets for different games with optimized settings
#
# Format:
# [preset-name]
# gamemode=true/false
# mangohud=true/false
# mangohud_config=option1,option2,option3
# env=VAR1=value1 VAR2=value2
#
# MangoHud config options: https://github.com/flightlessmango/MangoHud#mangohud_config-options
# Common options: fps_limit, vsync, gl_vsync, fps_only, position, font_size

# Default preset - gamemode + mangohud with basic settings
[default]
gamemode=true
mangohud=true
mangohud_config=fps,gpu_temp,cpu_temp,ram,vram

# Performance preset - maximum performance, minimal overlay
[performance]
gamemode=true
mangohud=true
mangohud_config=fps_only,position=top-right,font_size=24

# Diablo 4 - Optimized for ARPG gaming
# Includes DXVK VRAM fixes for NVIDIA cards
# Optimized for GE-Proton 10-28+
[diablo4]
gamemode=true
mangohud=false
mangohud_config=fps,gpu_temp,cpu_temp,frame_timing=0,position=top-left
env=DXVK_ASYNC=1 PROTON_ENABLE_NVAPI=1 PROTON_HIDE_NVIDIA_GPU=0 VKD3D_CONFIG=dxr11 DXVK_STATE_CACHE=0

# Diablo 4 (Skip Shader Pre-compile) - Use if game won't start
[diablo4-noshaders]
gamemode=true
mangohud=true
mangohud_config=fps,gpu_temp,cpu_temp,frame_timing=0,position=top-left
env=DXVK_ASYNC=1 PROTON_ENABLE_NVAPI=1 PROTON_HIDE_NVIDIA_GPU=0 VKD3D_CONFIG=dxr11 DXVK_STATE_CACHE=0 PROTON_NO_D3D11=0 PROTON_NO_D3D12=0 PROTON_NO_ESYNC=0 PROTON_NO_FSYNC=0

# Diablo 4 Debug - Full logging for troubleshooting
[diablo4-debug]
gamemode=true
mangohud=true
mangohud_config=fps,gpu_temp,cpu_temp,vram,ram,frame_timing=1
env=DXVK_ASYNC=1 PROTON_ENABLE_NVAPI=1 PROTON_LOG=1 DXVK_LOG_LEVEL=info DXVK_HUD=devinfo,fps WINEDEBUG=+timestamp,+tid,+seh,+relay VKD3D_CONFIG=dxr11 DXVK_STATE_CACHE=0

# Diablo 4 (AMD GPUs)
[diablo4-amd]
gamemode=true
mangohud=true
mangohud_config=fps,gpu_temp,cpu_temp,frame_timing=0,position=top-left
env=DXVK_ASYNC=1 RADV_PERFTEST=aco

# Path of Exile 2 - DirectX 12 optimized
[poe2]
gamemode=true
mangohud=true
mangohud_config=fps,gpu_temp,cpu_temp,position=top-left
env=DXVK_ASYNC=1

# The Division 2 - Ubisoft game with EasyAntiCheat
# Requires GE-Proton for EAC support
# DXVK_ASYNC disabled for EAC compatibility
[division2]
gamemode=true
mangohud=true
mangohud_config=fps,gpu_temp,cpu_temp,position=top-left
env=PROTON_ENABLE_NVAPI=1 PROTON_HIDE_NVIDIA_GPU=0 PROTON_EAC_RUNTIME=/home/christian/.steam/steam/steamapps/common/Proton EasyAntiCheat Runtime/

# Last Epoch - VRAM optimized
[lastepoch]
gamemode=true
mangohud=true
mangohud_config=fps,gpu_temp,cpu_temp
env=LD_PRELOAD="" PROTON_ENABLE_NVAPI=1 DXVK_FRAME_RATE=60

# Last Epoch (Low VRAM mode - uses OpenGL)
[lastepoch-lowvram]
gamemode=true
mangohud=true
mangohud_config=fps,gpu_temp
env=LD_PRELOAD="" PROTON_USE_WINED3D=1 DXVK_FRAME_RATE=60

# Competitive - For competitive games, minimal distractions
[competitive]
gamemode=true
mangohud=true
mangohud_config=fps_only,position=top-right,font_size=18
env=PROTON_NO_ESYNC=1

# Debug - Full monitoring for troubleshooting
[debug]
gamemode=true
mangohud=true
mangohud_config=full
env=PROTON_LOG=1 DXVK_HUD=full

# Capped 60 FPS - For games where you want to limit framerate
[capped60]
gamemode=true
mangohud=true
mangohud_config=fps,fps_limit=60,gpu_temp,cpu_temp

# Capped 120 FPS - For high refresh rate displays
[capped120]
gamemode=true
mangohud=true
mangohud_config=fps,fps_limit=120,gpu_temp,cpu_temp

# Minimal - Just gamemode, no overlay
[minimal]
gamemode=true
mangohud=false

# Monitor only - MangoHud without gamemode
[monitor]
gamemode=false
mangohud=true
mangohud_config=fps,gpu_temp,cpu_temp,ram,vram,frame_timing=1

# Streaming - Optimized for streaming/recording
[streaming]
gamemode=true
mangohud=true
mangohud_config=fps,gpu_temp,cpu_temp,position=bottom-left,font_size=20
env=OBS_VKCAPTURE=1

# AMD Optimized - Best settings for AMD GPU
[amd-optimized]
gamemode=true
mangohud=true
mangohud_config=fps,gpu_temp,cpu_temp,frame_timing=1
env=DXVK_ASYNC=1 RADV_PERFTEST=aco

# NVIDIA Optimized - Best settings for NVIDIA GPU
[nvidia-optimized]
gamemode=true
mangohud=true
mangohud_config=fps,gpu_temp,cpu_temp
env=DXVK_ASYNC=1 PROTON_ENABLE_NVAPI=1

# Compatibility Mode - For problematic games
[compatibility]
gamemode=true
mangohud=true
mangohud_config=fps,gpu_temp
env=PROTON_USE_WINED3D=1 PROTON_NO_ESYNC=1

# Laptop Hybrid GPU - Force dedicated GPU
[laptop-dgpu]
gamemode=true
mangohud=true
mangohud_config=fps,gpu_temp,cpu_temp
env=DRI_PRIME=1 DXVK_ASYNC=1

# 32-bit Game Fix - For older 32-bit games needing more RAM
[32bit-fix]
gamemode=true
mangohud=true
mangohud_config=fps,gpu_temp
env=PROTON_FORCE_LARGE_ADDRESS_AWARE=1

# Avatar: Frontiers of Pandora - Simple is best!
# Just use GE-Proton 10-28 with NO launch options
# GE-Proton has all optimizations built-in
# Optional: Use this preset only if you want gamemode + mangohud
[avatar-pandora]
gamemode=true
mangohud=true
mangohud_config=fps,gpu_temp,cpu_temp,vram,position=top-left

# Add your own presets below:
# [my-game]
# gamemode=true
# mangohud=true
# mangohud_config=fps,gpu_temp
