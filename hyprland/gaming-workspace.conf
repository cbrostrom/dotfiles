# ==================
# WORKSPACE 9 - ACTIVE GAMING
# ==================
# This workspace is optimized for actual game windows
# Workspace 5 is for game launchers (Steam, Lutris, etc.)
# Workspace 9 is for the games themselves

# Workspace definition
workspace = 9, monitor:DP-1, name:gaming-active, persistent:true

# Workspace-specific optimizations
workspace = 9, gapsin:0
workspace = 9, gapsout:0
workspace = 9, rounding:false
workspace = 9, border:false

# Window rules for games on workspace 9
windowrule {
  name = gaming_workspace_optimize
  match:workspace = 9
  immediate = on
  rounding = 0
  opacity = 1.0 1.0
}

# Automatically send fullscreen games to workspace 9
windowrule {
  name = fullscreen_to_gaming_workspace
  match:fullscreen = 1
  workspace = 9
  immediate = on
  rounding = 0
}

# ==================
# GAMING KEYBINDS
# ==================
# Quick switch to gaming workspace
# bind = SUPER, G, workspace, 9

# Move current window to gaming workspace
# bind = SUPER SHIFT, G, movetoworkspace, 9
