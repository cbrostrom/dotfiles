# sources/herdr/config.base.toml — canonical herdr config for fresh hosts.
# setup/herdr.sh seeds ~/.config/herdr/config.toml from this file when the host
# has none. It is never force-copied over an existing live config; edits made
# in the TUI or by plugins (Radar's managed blocks) survive on purpose.
# Radar re-applies its own managed blocks after plugin sync on attached hosts.

onboarding = false

[theme]
name = "catppuccin"
auto_switch = false

[ui]
status_indicators = "symbols"

[ui.sound]
enabled = false

[ui.toast]
delivery = "terminal"

# Plugin Manager popup (ray.plugin-manager)
[[keys.command]]
key = "prefix+p"
type = "plugin_action"
command = "ray.plugin-manager.open"
description = "open plugin manager"

# Herdr Radar keybindings are prefix-only by design (Managed blocks + snippet
# from `node bin/configure.js --keys`). Kept commented until wanted; both go
# through the prefix so they cannot collide with pane programs.
