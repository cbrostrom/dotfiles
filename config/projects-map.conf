#!/usr/bin/env bash
# projects-map.conf — config for kb map (sourced by map-scan.sh and friends)
# Edit this file only. No script changes needed to add roots, repos, or categories.

# Primary scan root (inventory.sh writes _inventory.json here)
PROJECTS_ROOT="${PROJECTS_ROOT:-$HOME/Projects}"

# Extra single-repo paths outside PROJECTS_ROOT (dotfiles, worktrees, etc.)
EXTRA_REPOS=(
  "$HOME/dotfiles"
  # "$HOME/worktrees/stellar-shopify-pr1306"
)

# Category inference: first matching pattern wins (path relative to PROJECTS_ROOT)
# Format: "glob-pattern|category"
# Categories: work-client, work-internal, work-shopify, private, sandbox, archive, personal
CATEGORY_RULES=(
  "Clients/*|work-client"
  "Shopify/*|work-shopify"
  "Internal/*|work-internal"
  "Private/*|private"
  "Workspaces/*|sandbox"
  "_archive/*|archive"
  "*|unknown"
)

# Target layout hint (used by plan-gen.sh / apply.sh — not by map.sh)
TARGET_LAYOUT="clients/<client>/<repo>"

# CODEBASE.md generation (used by map-codebase.sh)
CODEBASE_MAXDEPTH=2
CODEBASE_SKIP_IF_EXISTS=1   # 1 = skip if CODEBASE.md exists; 0 = overwrite
CODEBASE_FORCE=0            # --force flag sets this to 1 at runtime

# Vault output
VAULT_AI="${VAULT_AI:-$HOME/Vaults/AI}"
REGISTRY_PATH="$VAULT_AI/personal/projects-registry.md"

# Symlink farm (zellij sessionizer)
SYMLINK_ROOT="${SYMLINK_ROOT:-$HOME/.zellij-projects}"
