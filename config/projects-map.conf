#!/usr/bin/env bash
# projects-map.conf — config for higgins map (sourced by map-scan.sh and friends)
# Edit this file only. No script changes needed to add roots, repos, or categories.

# Primary scan root (inventory.sh writes _inventory.json here)
PROJECTS_ROOT="${PROJECTS_ROOT:-$HOME/Projects}"

# Extra single-repo paths outside PROJECTS_ROOT (dotfiles, worktrees, etc.)
EXTRA_REPOS=(
  "$HOME/dotfiles"
  # "$HOME/worktrees/stellar-shopify-pr1306"
)

# Category inference: first matching pattern wins (path relative to PROJECTS_ROOT)
# Format: "glob-pattern|category"
# Categories: work-client, work-internal, work-shopify, private, sandbox, archive, personal
CATEGORY_RULES=(
  "Clients/*|work-client"
  "Shopify/*|work-shopify"
  "Internal/*|work-internal"
  "Private/*|private"
  "Workspaces/*|sandbox"
  "_archive/*|archive"
  "*|unknown"
)

# Target layout hint (used by plan-gen.sh / apply.sh — not by map.sh)
TARGET_LAYOUT="clients/<client>/<repo>"

# CODEBASE.md generation (used by map-codebase.sh)
CODEBASE_MAXDEPTH=2
CODEBASE_SKIP_IF_EXISTS=1   # 1 = skip if CODEBASE.md exists; 0 = overwrite
CODEBASE_FORCE=0            # --force flag sets this to 1 at runtime

# Vault output
VAULT_AI="${VAULT_AI:-$HOME/Vaults/Higgins/AI}"
REGISTRY_PATH="$VAULT_AI/personal/projects-registry.md"

# Symlink farm (flat project dir for fuzzy finders / sessionizers)
SYMLINK_ROOT="${SYMLINK_ROOT:-$HOME/.project-farm}"

# ── Repo-orient MVP (R0-02): persistence allowlist ─────────────────────────────
# Only paths classified active-git-root + allowed category may use persistent
# codebase-memory graphs. Ephemeral worktrees never persist.

REPO_ORIENT_CACHE="${REPO_ORIENT_CACHE:-$HOME/.cache/repo-orientation}"
ALLOWLIST_JSON="$REPO_ORIENT_CACHE/allowlist.json"
CBM_REVIEW_JSON="$REPO_ORIENT_CACHE/cbm-deletion-review.json"

# Categories eligible for persistent indexing (client scopes stay separate rows)
PERSIST_CATEGORIES=(
  work-client
  work-shopify
  work-internal
  private
  personal
)

# Never persist graphs / capsules for these path substrings (case-sensitive paths)
PERSIST_DENY_SUBSTRINGS=(
  "/Vaults/"
  "/.mcporter"
  "/Documents/Codex/"
  "/Documents/Bil"
  "/bank/"
  "/OpenNotebook/"
  "/Library/CloudStorage/"
  "/private/var/"
  "/opencode-"
  "/.cursor/projects/"
  "node_modules"
)

# Regex-like path guards (bash case patterns) — invalid / non-repo roots
PERSIST_INVALID_PATTERNS=(
  "*/.cursor"
  "*/.cursor/*"
  "*/uploads"
)

# Worktree / temp detection (basename or path hints)
WORKTREE_PATH_HINTS=(
  "/worktrees/"
  "/.orca/worktrees/"
  "/T/opencode-"
)

# codebase-memory: require explicit --apply to delete (see map-cbm-review.sh)
CBM_DELETE_REQUIRES_APPLY=1
