#!/usr/bin/env bash
# config/fleet-hosts.conf — canonical fleet SSH + role registry
# Sourced by: scripts/install/ssh-superbro.sh, scripts/system/fleet-snapshot.sh
# Documented in: infra/fleet.md, infra/infra.html
#
# Format per line: name|address|port|user|profile|git_push|paseo|notes
#   address — Tailscale IP or MagicDNS hostname (must resolve from control plane)
#   git_push — allowed | never
#   paseo — local | ssh | optional | none

FLEET_SSH=(
  "mac|localhost|22|christian|desktop-full|allowed|local|Control plane; Paseo daemon local"
  "monsterbro|100.100.1.255|27789|christian|wsl|allowed|ssh|Work engine; Paseo daemon in WSL Debian 12"
  "linuxbro|100.100.1.100|27789|christian|server-headless|never|optional|Homelab docker/media; dockhand :8092"
  "superbro|100.100.1.50|27789|christian|server-headless|never|optional|VPS janitor; dockhand :8080, graphiti :8000"
)

# Tailscale mesh (control-plane view)
FLEET_TAILNET="100.100.0.0/16"

# mcporter remote MCP endpoints (Tailscale only)
FLEET_MCP=(
  "dockhand-linuxbro|http://100.100.1.100:8092/mcp|linuxbro"
  "dockhand-superbro|http://100.100.1.50:8080/mcp|superbro"
)

# Paseo remote CLI targets (from Mac orchestrator)
FLEET_PASEO_HOSTS=(
  "monsterbro|ssh://monsterbro|primary work engine"
  "linuxbro|ssh://linuxbro|light infra chores only"
)
