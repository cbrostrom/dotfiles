#!/usr/bin/env bash
# config/fleet-hosts.conf — canonical fleet SSH + role registry
# Sourced by: scripts/install/ssh-superbro.sh, scripts/system/fleet-snapshot.sh,
#            scripts/system/fleet-update.sh
# Documented in: infra/fleet.md, infra/infra.html
#
# Format per line: name|address|port|user|profile|role|git_push|paseo|key|notes
#   address — Tailscale IP or MagicDNS hostname (must resolve from control plane)
#   role — pilot | workstation | server | orchestrator (ACL design: docs/tailnet-access-plan.md)
#   git_push — allowed | never
#   paseo — local | ssh | optional | none
#   key — private key FILENAME in ~/.ssh used for this block (see docs/tailnet-access-plan.md;
#         interim per-host keys, replaced by per-source keys in Phase 3). Empty = no IdentityFile.

FLEET_SSH=(
  "mac|localhost|22|christian|macos|pilot|allowed|local||Control plane; Paseo daemon local"
  "monsterbro|100.100.1.255|27789|christian|wsl|workstation|allowed|ssh|id_ed25519_monsterbro|Work engine; Paseo daemon in WSL Debian 12"
  "monsterbro-wsl|100.100.1.255|27789|christian|wsl|workstation|allowed|ssh|id_ed25519_monsterbro|Tailscale name alias; same WSL target as monsterbro"
  "linuxbro|100.100.1.100|27789|christian|server|server|never|optional|id_ed25519_mac|Homelab docker/media; dockhand :8092"
  "superbro|100.100.1.50|27789|christian|server|server|never|optional|id_ed25519_mac|VPS janitor; dockhand :8080, graphiti :8000"
  "cloudbro|100.100.1.11|27789|christian|cloudbro|orchestrator|allowed|ssh|id_ed25519_mac|New devbox; on-premise later"
)

# Unique remote targets for scripts/system/fleet-update.sh. Keep aliases and the
# local control plane out of this list.
FLEET_DOTFILES_HOSTS=(
  "monsterbro"
  "linuxbro"
  "superbro"
  "cloudbro"
)

# Tailscale mesh (control-plane view)
FLEET_TAILNET="100.100.0.0/16"

# mcporter remote MCP endpoints (Tailscale only)
FLEET_MCP=(
  "dockhand-linuxbro|http://100.100.1.100:8092/mcp|linuxbro"
  "dockhand-superbro|http://100.100.1.50:8080/mcp|superbro"
)

# Paseo remote CLI targets (from Mac orchestrator)
FLEET_PASEO_HOSTS=(
  "monsterbro|ssh://monsterbro|primary work engine"
  "linuxbro|ssh://linuxbro|light infra chores only"
)
