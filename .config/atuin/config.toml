# atuin client config — synced via dotfiles
# Server: superbro VPS, exposed only on Tailscale (no public)
# To register on a fresh machine:
#   atuin register -u <user> -e <email>
#   atuin import zsh        # import existing ~/.zsh_history
#   atuin sync

sync_address = "http://superbro:8888"
sync_frequency = "10m"

dialect = "uk"
auto_sync = true
update_check = false

style = "compact"
inline_height = 20
show_preview = true
search_mode = "fuzzy"
filter_mode = "global"
filter_mode_shell_up_key_binding = "session"

history_filter = [
    "^secret-.*",
    "^export .*TOKEN.*",
    "^export .*KEY.*",
]
