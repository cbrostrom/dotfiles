onboarding = false
default_shell = "/bin/zsh"
new_cwd       = "follow"

[worktrees]
directory = "~/.herdr/worktrees"

[ui]
mouse_capture                    = true
confirm_close                    = true
mobile_width_threshold           = 80
show_agent_labels_on_pane_borders = true
agent_panel_scope = "all"

[theme]
name = "one-dark"

[advanced]
pane_history              = true
scrollback_limit_bytes    = 20971520  # 20 MB
kitty_clipboard_protocol  = false

[ui.toast]
delivery = "terminal"

[ui.sound]
enabled = false

[experimental]
pane_history = true
switch_ascii_input_source_in_prefix = false
