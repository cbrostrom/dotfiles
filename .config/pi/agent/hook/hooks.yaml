# PI global hooks — managed by ~/dotfiles
# Source: ~/dotfiles/.config/pi/agent/hook/hooks.yaml
# Install: modules/pi/install.sh (symlinked to ~/.pi/agent/hook/hooks.yaml)
#
# Compatibility: pi-yaml-hooks 2026.6.x, PI 0.84.x (run /hooks-validate)
#
# To verify: inside PI run /hooks-validate then /hooks-status
# To disable: remove or comment out individual hook entries

hooks:
  # Session-start readiness notify → pane-notify extension (pi-extensions).
  # Re-enable here only if pane-notify is removed.

  # Idle: auto-prune + compact
  # Fires after turn completion with no pending messages.
  # Silently runs higgins prune + compact to keep brains tidy.
  # Does NOT auto-save narrative context — that requires agent judgement (.remember).
  - id: idle-kb-tidy
    event: session.idle
    actions:
      - bash: |
          # Determine slug from cwd (mirrors higgins slug resolution)
          if git rev-parse --git-dir >/dev/null 2>&1; then
            SLUG="$(basename "$(git rev-parse --show-toplevel 2>/dev/null)")"
          else
            SLUG="$(basename "$PWD")"
          fi
          higgins prune "$SLUG" 2>/dev/null || true
          higgins compact "$SLUG" 2>/dev/null || true

  # File changed: aislop quality check
  # Runs after PI writes/edits code files. aislop --pi checks score regression.
  # Exit code 2 would block (aislop hook pi uses PI hook protocol).
  - id: aislop-after-edit
    event: file.changed
    conditions:
      - matchesCodeFiles
    actions:
      - bash: "aislop hook pi"

  # Before bash: destructive command guard
  # Blocks patterns that should never run silently. Exit code 2 = hard stop.
  # Reads the bash command from hook stdin JSON (.tool_args.command).
  # Falls back to raw payload substring match if jq is unavailable.
  # Intentionally narrow — don't over-block legitimate dev commands.
  # NOTE: pi-permissions.jsonc is the primary guard; this is a defence-in-depth layer.
  - id: guard-destructive
    event: tool.before.bash
    actions:
      - bash: |
          payload=$(cat)
          # Extract command from stdin JSON; fall back to raw payload if jq missing
          if command -v jq >/dev/null 2>&1; then
            cmd=$(printf '%s' "$payload" | jq -r '.tool_args.command // empty' 2>/dev/null)
          else
            cmd="$payload"
          fi
          [[ -z "$cmd" ]] && exit 0
          blocked=0
          # Force push (including --force-with-lease)
          echo "$cmd" | grep -qE 'git push.*(--force|--force-with-lease|-f\b)' && blocked=1
          # rm -rf on root/home dirs
          echo "$cmd" | grep -qE 'rm -rf (/[^/]|~|/home|/Users)' && blocked=1
          # publish / release / pr merge
          echo "$cmd" | grep -qE '(gh release create|gh pr merge|npm publish|cargo publish|twine upload)' && blocked=1
          if [[ "$blocked" == "1" ]]; then
              echo "[pi-guard] Blocked: $cmd" >&2
              exit 2
          fi
