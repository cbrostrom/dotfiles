# PI global hooks — managed by ~/dotfiles
# Source: ~/dotfiles/.config/pi/agent/hook/hooks.yaml
# Install: modules/pi/install.sh (symlinked to ~/.pi/agent/hook/hooks.yaml)
#
# Compatibility: pi-yaml-hooks 2026.6.x, PI 0.79.x (tested on 0.80.x — run /hooks-validate)
#
# To verify: inside PI run /hooks-validate then /hooks-status
# To disable: remove or comment out individual hook entries

hooks:
  # ── Session start: readiness notification ────────────────────────────────────
  # A lightweight signal that global hooks loaded. Does not inject brain into
  # model context (PI hook stdout ≠ additional_context). Run `kb load` manually
  # or type `.remember` if you want a full digest + prune pass.
  - id: session-ready
    event: session.created
    actions:
      - notify:
          text: "PI ready. Vault indexed → `ctx_search 'query'` for module/project lookups. `kb load` for structured briefing."
          level: info

  # ── Session start: vault knowledge index ─────────────────────────────────────
  # Indexes personal/ + modules/ + active project brain into context-mode's FTS5
  # DB for the current working directory. This makes vault knowledge searchable
  # via ctx_search without loading files into context. Re-indexing unchanged files
  # is a no-op (~100ms/path). Excludes sessions/ and history/ (noisy, not knowledge).
  # Requires context-mode extension (npm:context-mode) to be installed in PI.
  - id: vault-ctx-index
    event: session.created
    actions:
      - bash: |
          CTX="$HOME/.pi/agent/npm/node_modules/.bin/context-mode"
          [[ -x "$CTX" ]] || exit 0
          VAULT="${VAULT_AI:-$HOME/Vaults/AI}"
          [[ -d "$VAULT" ]] || exit 0
          # Determine active project slug (mirrors kb slug resolution)
          if git rev-parse --git-dir >/dev/null 2>&1; then
            SLUG="$(basename "$(git rev-parse --show-toplevel 2>/dev/null)")"
          else
            SLUG="$(basename "$PWD")"
          fi
          # Index into current project's DB so ctx_search works without --project flag
          "$CTX" index "$VAULT/personal/" --project "$PWD" --ext .md 2>/dev/null || true
          "$CTX" index "$VAULT/modules/"  --project "$PWD" --ext .md 2>/dev/null || true
          # Active project brain only (skip history/ and archive/ — not knowledge)
          if [[ -d "$VAULT/projects/$SLUG" ]]; then
            "$CTX" index "$VAULT/projects/$SLUG/" \
              --project "$PWD" --ext .md \
              --exclude "history/**" --exclude "archive/**" 2>/dev/null || true
          fi

  # ── Idle: auto-prune + compact + nudge ───────────────────────────────────────
  # Fires after turn completion with no pending messages.
  # Silently runs kb prune + compact to keep brains tidy, then nudges if
  # there was meaningful activity (kb prune/compact prints output when it acts).
  # Does NOT auto-save narrative context — that requires agent judgement (.remember).
  - id: idle-kb-tidy
    event: session.idle
    actions:
      - bash: |
          KB="${VAULT_AI:-$HOME/Vaults/AI}/tools/kb"
          [[ -x "$KB" ]] || exit 0
          # Determine slug from cwd (mirrors kb slug resolution)
          if git rev-parse --git-dir >/dev/null 2>&1; then
            SLUG="$(basename "$(git rev-parse --show-toplevel 2>/dev/null)")"
          else
            SLUG="$(basename "$PWD")"
          fi
          "$KB" prune "$SLUG" 2>/dev/null || true
          "$KB" compact "$SLUG" 2>/dev/null || true
      - notify:
          text: "Session idle. Type `.remember` to run kb digest (scans sessions, proposes updates)."
          level: info

  # ── /new: auto-digest before session is discarded ───────────────────────────
  # Fires only when reason=new (/new command). Runs full kb remember (digest +
  # prune + compact) so context is preserved before the slate is wiped.
  # session.deleted stdin JSON contains {"reason": "new"|"quit"|"reload"|...}
  - id: new-session-digest
    event: session.deleted
    actions:
      - bash: |
          REASON="$(python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('reason',''))" 2>/dev/null || true)"
          [[ "$REASON" == "new" ]] || exit 0
          KB="${VAULT_AI:-$HOME/Vaults/AI}/tools/kb"
          [[ -x "$KB" ]] || exit 0
          if git rev-parse --git-dir >/dev/null 2>&1; then
            SLUG="$(basename "$(git rev-parse --show-toplevel 2>/dev/null)")"
          else
            SLUG="$(basename "$PWD")"
          fi
          # Full digest: scans recent sessions, proposes entries, auto-prunes+compacts
          VAULT_AI="${VAULT_AI:-$HOME/Vaults/AI}" "$KB" digest "$SLUG" 2>/dev/null || true

  # ── Session end (quit/reload): digest + tidy + re-index ─────────────────────
  # Fires on quit/reload/fork — NOT on /new (new-session-digest already handles
  # that case). Runs kb digest from session logs (no AI needed, reads disk only),
  # prune+compact, and FTS5 re-index. Best-effort: session.deleted is lossy and
  # the hook may not always fire on hard kills, but covers normal quit cleanly.
  - id: session-end-tidy
    event: session.deleted
    actions:
      - bash: |
          REASON="$(python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('reason',''))" 2>/dev/null || true)"
          [[ "$REASON" == "new" ]] && exit 0  # new-session-digest already ran
          KB="${VAULT_AI:-$HOME/Vaults/AI}/tools/kb"
          [[ -x "$KB" ]] || exit 0
          CTX="$HOME/.pi/agent/npm/node_modules/.bin/context-mode"
          VAULT="${VAULT_AI:-$HOME/Vaults/AI}"
          if git rev-parse --git-dir >/dev/null 2>&1; then
            SLUG="$(basename "$(git rev-parse --show-toplevel 2>/dev/null)")"
          else
            SLUG="$(basename "$PWD")"
          fi
          # Digest: reads session logs on disk, synthesises vault entries, no AI context needed
          VAULT_AI="$VAULT" "$KB" digest "$SLUG" 2>/dev/null || true
          # Structural tidy
          "$KB" prune "$SLUG" 2>/dev/null || true
          "$KB" compact "$SLUG" 2>/dev/null || true
          # Re-index FTS5 so next session starts with fresh vault knowledge
          if [[ -x "$CTX" && -d "$VAULT" ]]; then
            "$CTX" index "$VAULT/personal/" --project "$VAULT" --ext .md 2>/dev/null || true
            "$CTX" index "$VAULT/modules/"  --project "$VAULT" --ext .md 2>/dev/null || true
            [[ -d "$VAULT/projects/$SLUG" ]] && \
              "$CTX" index "$VAULT/projects/$SLUG/" \
                --project "$VAULT" --ext .md \
                --exclude "history/**" --exclude "archive/**" 2>/dev/null || true
          fi

  # ── File changed: aislop quality check ───────────────────────────────────────
  # Runs after PI writes/edits code files. aislop --pi checks score regression.
  # Exit code 2 would block (aislop hook pi uses PI hook protocol).
  - id: aislop-after-edit
    event: file.changed
    conditions:
      - matchesCodeFiles
    actions:
      - bash: "aislop hook pi"

  # ── Before bash: destructive command guard ────────────────────────────────────
  # Blocks patterns that should never run silently. Exit code 2 = hard stop.
  # Covers the most obvious force-push / publish / scorched-earth patterns.
  # Intentionally narrow — don't over-block legitimate dev commands.
  - id: guard-destructive
    event: tool.before.bash
    actions:
      - bash: |
          cmd="$(echo "$PI_TOOL_ARGS_COMMAND" 2>/dev/null || true)"
          blocked=0
          # Force push to any remote
          echo "$cmd" | grep -qE 'git push.*(--force|-f)' && blocked=1
          # rm -rf on root/home dirs
          echo "$cmd" | grep -qE 'rm -rf (/|~|/home|/Users)' && blocked=1
          # gh release create / pr merge / npm publish / cargo publish
          echo "$cmd" | grep -qE '(gh release create|gh pr merge|npm publish|cargo publish|pip publish)' && blocked=1
          if [[ "$blocked" == "1" ]]; then
              echo "[pi-guard] Blocked: $cmd" >&2
              exit 2
          fi

  # ── After kb write: re-index vault into context-mode ─────────────────────────
  # Keeps the FTS5 index fresh whenever kb mutates vault files (save/wrap/compact).
  # Fires only on matching kb commands, ~100ms overhead, fully silent.
  - id: kb-write-reindex
    event: tool.after.bash
    actions:
      - bash: |
          cmd="$(echo "$PI_TOOL_ARGS_COMMAND" 2>/dev/null || true)"
          # Only trigger on kb write operations
          echo "$cmd" | grep -qE '\bkb (save|wrap|compact|prune)\b' || exit 0
          CTX="$HOME/.pi/agent/npm/node_modules/.bin/context-mode"
          [[ -x "$CTX" ]] || exit 0
          VAULT="${VAULT_AI:-$HOME/Vaults/AI}"
          [[ -d "$VAULT" ]] || exit 0
          if git rev-parse --git-dir >/dev/null 2>&1; then
            SLUG="$(basename "$(git rev-parse --show-toplevel 2>/dev/null)")"
          else
            SLUG="$(basename "$PWD")"
          fi
          "$CTX" index "$VAULT/personal/" --project "$PWD" --ext .md 2>/dev/null || true
          "$CTX" index "$VAULT/modules/"  --project "$PWD" --ext .md 2>/dev/null || true
          [[ -d "$VAULT/projects/$SLUG" ]] && \
            "$CTX" index "$VAULT/projects/$SLUG/" \
              --project "$PWD" --ext .md \
              --exclude "history/**" --exclude "archive/**" 2>/dev/null || true
