# ============================================================================
# tmux config — laesr / Christian Brostrom
# Location: ~/dotfiles/.config/tmux/tmux.conf
# Symlinked to: ~/.config/tmux/tmux.conf
# Reload in tmux: prefix + r
# ============================================================================


# ----------------------------------------------------------------------------
# 1. CORE BEHAVIOUR
# ----------------------------------------------------------------------------

# Use Ctrl-a as prefix (easier than default Ctrl-b which clashes with readline back-char)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# True color + italics for Ghostty / modern terminals
# Without these, nvim/bat/etc. will render with wrong colours inside tmux.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB,xterm-ghostty:RGB"

# Remove ESC delay (Vim feels laggy without this)
set -s escape-time 0

# Big scrollback
set -g history-limit 100000

# Windows/panes start at 1 (matches keyboard top row, easier than 0)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g automatic-rename on

# Resize panes to smallest client only when both are looking at same window
set -g aggressive-resize on

# Mouse on: scroll, click, drag-to-resize, click-to-focus pane
set -g mouse on

# Default editor (used by tmux-open and other plugins)
set-environment -g EDITOR "cursor"


# ----------------------------------------------------------------------------
# 2. SPLITS & WINDOWS
# ----------------------------------------------------------------------------

# Intuitive split keys + open in current directory (default opens in $HOME)
unbind '"'
unbind %
bind v split-window -h -c "#{pane_current_path}"   # vertical split (panes side-by-side)
bind h split-window -v -c "#{pane_current_path}"   # horizontal split (panes stacked)

# New window also inherits current path
bind c new-window -c "#{pane_current_path}"

# Quick layout switching
bind l select-layout main-vertical
bind V select-layout even-vertical
bind H select-layout even-horizontal


# ----------------------------------------------------------------------------
# 3. NAVIGATION
# ----------------------------------------------------------------------------

# Switch panes with Alt + arrow (no prefix needed)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D


# ----------------------------------------------------------------------------
# 4. QUALITY OF LIFE
# ----------------------------------------------------------------------------

# Reload config without restarting tmux
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# Visual bells off (no flashing screen)
set -g visual-bell off
set -g visual-silence off
set -g monitor-silence 0

# Auto-lock after 60 min idle (uses default vlock/lock-command)
set -g lock-after-time 3600


# ----------------------------------------------------------------------------
# 5. PLUGINS (managed via TPM)
# ----------------------------------------------------------------------------
# Install:    prefix + I  (capital i)
# Update:     prefix + U
# Uninstall:  prefix + alt + u  (after removing line below)

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'        # sane defaults
set -g @plugin 'tmux-plugins/tmux-yank'            # copy to macOS clipboard
set -g @plugin 'tmux-plugins/tmux-open'            # 'o' to open URL/file under cursor
set -g @plugin 'tmux-plugins/tmux-prefix-highlight' # status bar shows when prefix active
set -g @plugin 'tmux-plugins/tmux-resurrect'       # save/restore sessions manually
set -g @plugin 'tmux-plugins/tmux-continuum'       # auto-save sessions every 15 min
set -g @plugin 'wfxr/tmux-fzf-url'                 # fuzzy-pick URLs from scrollback
set -g @plugin 'wfxr/tmux-power'                   # status bar theme
set -g @plugin 'omerxx/tmux-sessionx'              # fuzzy session/window switcher

# --- tmux-resurrect / continuum ---
set -g @resurrect-capture-pane-contents 'on'        # restore visible pane content too
set -g @resurrect-strategy-nvim 'session'           # restore Neovim sessions if any
set -g @continuum-restore 'on'                      # auto-restore on tmux start
# NOTE: continuum-boot is intentionally OFF — tmux only starts when you say so.

# --- tmux-sessionx (fuzzy switcher) ---
set -g @sessionx-bind 'O'                           # capital O — does NOT clash with prefix+z (zoom)
set -g @sessionx-prefix 'on'
set -g @sessionx-ls-command 'lsd --tree --color=always --icon=always'
set -g @sessionx-tmuxinator-mode 'on'
set -g @sessionx-legacy-fzf-support 'off'
set -g @sessionx-zoxide-mode 'off'
set -g @sessionx-fzf-marks-mode 'on'
set -g @sessionx-filter-current 'false'

# --- tmux-fzf-url ---
set -g @fzf-url-bind 'u'                            # prefix + u (NOT 'o' — that's tmux-open)

# --- tmux-power theme ---
set -g @tmux_power_theme 'everforest'
set -g @tmux_power_date_icon ''
set -g @tmux_power_time_icon ''
set -g @tmux_power_user_icon ''
set -g @tmux_power_session_icon ''
set -g @tmux_power_show_upload_speed    false
set -g @tmux_power_show_download_speed  false
set -g @tmux_power_show_web_reachable   true
set -g @tmux_power_right_arrow_icon     ''
set -g @tmux_power_left_arrow_icon      ''
set -g @tmux_power_prefix_highlight_pos 'LR'
set -g @tmux_power_date_format '%F'
set -g @tmux_power_time_format '%T'


# ----------------------------------------------------------------------------
# 6. INIT (TPM bootstrap — always last in file)
# ----------------------------------------------------------------------------

set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"

# Auto-install TPM on first run
if "test ! -d ~/.tmux/plugins/tpm" \
  "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && \
       ~/.tmux/plugins/tpm/bin/install_plugins'"

run '~/.tmux/plugins/tpm/tpm'
