# Starship prompt configuration for web development
# Modern, fast, and informative prompt

# Get editor info
[character]
success_symbol = "[➜](bold green)"
error_symbol = "[](bold red)"

[directory]
truncation_length = 3
truncation_symbol = "…/"
style = "blue bold"

[git_branch]
format = '\[ [${symbol}${branch}]($style) \]'
symbol = " "
style = "purple bold"


[git_status]
format = '([\[ $all_status$ahead_behind \]]($style))'
style = "red bold"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
stashed = "≡"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[nodejs]
format = '\[ [$symbol($version)]($style) \]'
symbol = "󰎙 "
style = "green bold"
detect_extensions = ["js", "mjs", "cjs", "ts", "jsx", "tsx", "json"]

[package]
format = '\[[$symbol$version]($style)\]'
symbol = "󰏗 "
style = "red bold"

[rust]
format = '\[[$symbol($version)]($style)\]'
symbol = " "
style = "red bold"

[golang]
format = '\[[$symbol($version)]($style)\]'
symbol = " "
style = "cyan bold"

[python]
format = '\[[${symbol}${pyenv_prefix}(${version})(\($virtualenv\))]($style)\]'
symbol = " "
style = "yellow bold"

[php]
format = '\[[$symbol($version)]($style)\]'
symbol = " "
style = "blue bold"

[ruby]
format = '\[[$symbol($version)]($style)\]'
symbol = " "
style = "red bold"

[java]
format = '\[[$symbol($version)]($style)\]'
symbol = " "
style = "red dimmed"

[scala]
format = '\[[$symbol($version)]($style)\]'
symbol = " "
style = "red dimmed"

[elixir]
format = '\[[$symbol($version \(OTP $otp_version\))]($style)\]'
symbol = " "
style = "purple bold"

[swift]
format = '\[[$symbol($version)]($style)\]'
symbol = " "
style = "yellow bold"

[ocaml]
format = '\[[$symbol($version)(\($switch_indicator$switch_name\))]($style)\]'
symbol = " "
style = "yellow bold"

[erlang]
format = '\[[$symbol($version)]($style)\]'
symbol = " "
style = "red bold"

[memory_usage]
format = '\[$symbol[$ram( | $swap)]($style)\]'
style = "white bold dimmed"
symbol = "󰍛 "
threshold = 75
disabled = false

[cmd_duration]
format = '\[[⏱ $duration]($style)\]'
min_time = 2_000
style = "yellow"

[aws]
format = '\[[$symbol($profile)(\($region\))(\[$duration\])]($style)\]'
symbol = " "
style = "yellow bold"
disabled = false

[gcloud]
format = '\[[$symbol$account(@$domain)(\($region\))]($style)\]'
symbol = "󱇶 "
style = "blue bold"
disabled = false

[kubernetes]
format = '\[[$symbol$context( \($namespace\))]($style)\]'
symbol = " "
style = "blue bold"
disabled = false

[docker_context]
format = '\[[$symbol$context]($style)\]'
symbol = "󰡨 "
style = "blue bold"
disabled = false

[terraform]
format = '\[[$symbol$workspace]($style)\]'
style = "purple bold"
disabled = false

[time]
format = '[$time]($style) '
disabled = false
time_range = "-30s"
style = "bold white"
