symbol = "ஃ "
style = "#4c566a bold"

[kotlin]
format = '\[ [$symbol$version ]($style)\] '
symbol = "🅺 "
style = "#4c566a bold"

[lua]
format = '\[ [$symbol$version ]($style)\] '
symbol = "🌙 "
style = "#4c566a bold"

[nim]
format = '\[ [$symbol$version ]($style)\] '
symbol = "👑 "
style = "#4c566a bold"

[nix_shell]
