# =============================================================================
# SYSTEM INFORMATION
# =============================================================================
[memory_usage]
format = '\[ [$symbol$ram | $swap ]($style)\] '
symbol = "󰍛 "
style = "#f4a261 bold dimmed"
threshold = 75
disabled = false

[cmd_duration]
format = '\[ [⏱ $duration ]($style)\] '
min_time = 2000
style = "#f6aa1c bold"

# =============================================================================
# CLOUD & INFRASTRUCTURE TOOLS
# =============================================================================
[aws]
format = '\[ [$symbol$profile$region$duration ]($style)\] '
symbol = " "
style = "#e25822 bold"
disabled = false

[gcloud]
format = '\[ [$symbol$account@$domain$region ]($style)\] '
symbol = "󱇶 "
style = "#f4a261 bold"
disabled = true

[kubernetes]
format = '\[ [$symbol$context$namespace ]($style)\] '
symbol = " "
style = "#e76f51 bold"
disabled = false

[docker_context]
format = '\[ [$symbol$context ]($style)\] '
symbol = "󰡨 "
style = "#f6aa1c bold"
disabled = false

[terraform]
format = '\[ [$symbol$workspace ]($style)\] '
style = "#e25822 bold"
disabled = false

# =============================================================================
# TIME & UTILITY
# =============================================================================
[time]
format = '\[ [$time ]($style)\] '
style = "#6272a4 bold"
disabled = false
time_range = "-30s"

[battery]
format = '\[ [$symbol$percentage ]($style)\] '
full_symbol = "🔋"
charging_symbol = "⚡"
discharging_symbol = "💀"
unknown_symbol = "❓"
empty_symbol = "🪫"
disabled = false

[conda]
format = '\[ [$symbol$environment ]($style)\] '
symbol = "🅒 "
style = "#4c566a bold"
ignore_base = false
