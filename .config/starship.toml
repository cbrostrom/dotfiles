# =============================================================================
# Starship prompt configuration for web development
# Modern, fast, and informative prompt
# =============================================================================

# Warm Nordic color palette
# #e25822 user
# #e76f51 dir
# #f4a261 git/branch
# #f6aa1c package/time
# #e63946 error/status
# #4c566a version/lang
# #5e81ac doc
# #6272a4 time

# =============================================================================
# GLOBAL
# =============================================================================
# Bump default 500ms — fnm multishell node shims add startup latency and
# can blow past the default, producing "command timed out" warnings.
command_timeout = 2000

# =============================================================================
# PROMPT CHARACTER
# =============================================================================
[character]
success_symbol = " [➜](#e25822 bold) "
error_symbol = " [✗](#e63946 bold) "

# =============================================================================
# DIRECTORY
# =============================================================================
[directory]
truncation_length = 2
truncation_symbol = " …/ "
style = "#e76f51 bold"

# =============================================================================
# GIT INTEGRATION
# =============================================================================
[git_branch]
format = '\[ [$symbol$branch ]($style)\] '
symbol = " "
style = "#f4a261 bold"

[git_status]
# Enhanced git status with better visual indicators
format = '\[ [$ahead_behind$conflicted$staged$modified$untracked$renamed$deleted$stashed]($style)\] '
style = "#f4a261 bold"

# Symbols with counts and better emojis
conflicted = "🏳$count "
ahead = "⇡$count "
behind = "⇣$count "
diverged = "⇕⇡$ahead_count⇣$behind_count "
untracked = "🤷$count "
stashed = "📦$count "
modified = "📝$count "
staged = "++$count "
renamed = "👅$count "
deleted = "🗑$count "

# =============================================================================
# LANGUAGE VERSIONS
# =============================================================================
[nodejs]
format = '\[ [$symbol$version ]($style)\] '
symbol = "󰎙 "
style = "#4c566a bold"
detect_extensions = ["js", "mjs", "cjs", "ts", "jsx", "tsx"]
detect_files = ["package.json", "node_modules", ".nvmrc", ".node-version"]

[package]
format = '\[ [$symbol$version ]($style)\] '
symbol = "󰏗 "
style = "#f6aa1c bold"

[rust]
format = '\[ [$symbol$version ]($style)\] '
symbol = " "
style = "#4c566a bold"

[golang]
format = '\[ [$symbol$version ]($style)\] '
symbol = " "
style = "#4c566a bold"

[python]
format = '\[ [$symbol$pyenv_prefix$version$virtualenv ]($style)\] '
symbol = " "
style = "#4c566a bold"

[php]
format = '\[ [$symbol$version ]($style)\] '
symbol = " "
style = "#4c566a bold"

[ruby]
format = '\[ [$symbol$version ]($style)\] '
symbol = " "
style = "#4c566a bold"

[java]
format = '\[ [$symbol$version ]($style)\] '
symbol = " "
style = "#4c566a dimmed"

[scala]
format = '\[ [$symbol$version ]($style)\] '
symbol = " "
style = "#4c566a dimmed"

[elixir]
