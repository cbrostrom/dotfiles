# =============================================================================
# Starship prompt configuration for web development
# Modern, fast, and informative prompt
# =============================================================================

# Warm Nordic color palette
# #e25822 user
# #e76f51 dir
# #f4a261 git/branch
# #f6aa1c package/time
# #e63946 error/status
# #4c566a version/lang
# #5e81ac doc
# #6272a4 time

# =============================================================================
# GLOBAL
# =============================================================================
# Bump default 500ms — fnm multishell node shims add startup latency and
# can blow past the default, producing "command timed out" warnings.
command_timeout = 2000

format = """$directory$git_branch$git_status$package$nodejs$golang$rust$python$docker_context$aws$kubernetes$terraform$memory_usage$cmd_duration$conda$battery$fill$env_var
$time$character"""

# =============================================================================
# PROMPT CHARACTER
# =============================================================================
[character]
success_symbol = " [➜](#e25822 bold) "
error_symbol = " [✗](#e63946 bold) "

# =============================================================================
# DIRECTORY
# =============================================================================
[directory]
truncation_length = 4
truncation_symbol = ""
truncate_to_repo = true
format = "[ $path]($style) "
style = "#e76f51 bold"

# =============================================================================
# FILL — pushes PWD to right edge of line 1
# =============================================================================
[fill]
symbol = " "

# =============================================================================
# FULL PATH (right side of line 1 — mouse-selectable for copy)
# =============================================================================
[env_var.PWD]
format = "[$env_value]($style)"
style = "#4c566a dimmed"
variable = "PWD"

# =============================================================================
# GIT INTEGRATION
# =============================================================================
[git_branch]
format = '\[ [$symbol$branch ]($style)\] '
symbol = " "
style = "#f4a261 bold"

[git_status]
format = '\[ [$ahead_behind$conflicted$staged$modified$untracked$renamed$deleted$stashed]($style)\] '
style = "#f4a261 bold"

conflicted = "🏳$count "
ahead = "⇡$count "
behind = "⇣$count "
diverged = "⇕⇡$ahead_count⇣$behind_count "
untracked = "🤷$count "
stashed = "📦$count "
modified = "📝$count "
staged = "++$count "
renamed = "👅$count "
deleted = "🗑$count "

# =============================================================================
# LANGUAGE VERSIONS
# =============================================================================
[nodejs]
format = '\[ [$symbol$version ]($style)\] '
symbol = "󰎙 "
style = "#4c566a bold"
detect_extensions = ["js", "mjs", "cjs", "ts", "jsx", "tsx"]
detect_files = ["package.json", "node_modules", ".nvmrc", ".node-version"]

[golang]
format = '\[ [$symbol$version ]($style)\] '
symbol = " "
style = "#4c566a bold"

[rust]
format = '\[ [$symbol$version ]($style)\] '
symbol = " "
style = "#4c566a bold"

[python]
format = '\[ [$symbol$pyenv_prefix$version$virtualenv ]($style)\] '
symbol = " "
style = "#4c566a bold"

[package]
format = '\[ [$symbol$version ]($style)\] '
symbol = "󰏗 "
style = "#f6aa1c bold"

# =============================================================================
# SYSTEM INFORMATION
# =============================================================================
[memory_usage]
format = '\[ [$symbol$ram | $swap ]($style)\] '
symbol = "󰍛 "
style = "#f4a261 bold dimmed"
threshold = 75
disabled = false

[cmd_duration]
format = '\[ [⏱ $duration ]($style)\] '
min_time = 2000
style = "#f6aa1c bold"

# =============================================================================
# CLOUD & INFRASTRUCTURE TOOLS
# =============================================================================
[aws]
format = '\[ [$symbol$profile$region$duration ]($style)\] '
symbol = " "
style = "#e25822 bold"
disabled = false

[gcloud]
format = '\[ [$symbol$account@$domain$region ]($style)\] '
symbol = "󱇶 "
style = "#f4a261 bold"
disabled = true

[kubernetes]
format = '\[ [$symbol$context$namespace ]($style)\] '
symbol = " "
style = "#e76f51 bold"
disabled = false

[docker_context]
format = '\[ [$symbol$context ]($style)\] '
symbol = "󰡨 "
style = "#f6aa1c bold"
disabled = false

[terraform]
format = '\[ [$symbol$workspace ]($style)\] '
style = "#e25822 bold"
disabled = false

# =============================================================================
# TIME & UTILITY
# =============================================================================
[time]
format = '\[ [$time ]($style)\] '
style = "#6272a4 bold"
disabled = false

[battery]
format = '\[ [$symbol$percentage ]($style)\] '
full_symbol = "🔋"
charging_symbol = "⚡"
discharging_symbol = "💀"
unknown_symbol = "❓"
empty_symbol = "🪫"
disabled = false

[conda]
format = '\[ [$symbol$environment ]($style)\] '
symbol = "🅒 "
style = "#4c566a bold"
ignore_base = false
