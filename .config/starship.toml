symbol = "📊 "
style = "#4c566a bold"

[red]
format = '\[ [$symbol$version ]($style)\] '
symbol = "🔺 "
style = "#4c566a bold"

[solidity]
format = '\[ [$symbol$version ]($style)\] '
symbol = "🔷 "
