# =============================================================================
# Procs Configuration
# =============================================================================
# A modern replacement for ps written in Rust
# Docs: https://github.com/dalance/procs
#
# ps bruges til at se kørende processer (som 'top' men som snapshot)
# procs er en moderne replacement med farver og bedre output

[[columns]]
kind = "Pid"
style = "BrightBlue"
numeric_search = true
align = "Right"

[[columns]]
kind = "User"
style = "BrightYellow"
max_width = 12

[[columns]]
kind = "State"
style = "BrightGreen"
max_width = 1

[[columns]]
kind = "UsageCpu"
style = "BrightGreen"
numeric_search = true
align = "Right"

[[columns]]
kind = "UsageMem"
style = "BrightRed"
numeric_search = true
align = "Right"

[[columns]]
kind = "VmSize"
style = "BrightCyan"
numeric_search = true
align = "Right"

[[columns]]
kind = "TcpPort"
style = "BrightMagenta"
numeric_search = true
align = "Right"
max_width = 20

[[columns]]
kind = "StartTime"
style = "BrightWhite"

[[columns]]
kind = "Command"
style = "BrightWhite"
max_width = 0

[style]
header = "BrightWhite"
unit = "BrightWhite"
tree = "BrightBlack"

[style.by_percentage]
color_000 = "BrightGreen"
color_025 = "BrightYellow"
color_050 = "BrightMagenta"
color_075 = "BrightRed"
color_100 = "BrightRed"

[style.by_state]
color_d = "BrightRed"      # Dead
color_r = "BrightGreen"    # Running
color_s = "BrightCyan"     # Sleeping
color_t = "BrightYellow"   # Stopped
color_z = "BrightRed"      # Zombie
color_x = "BrightMagenta"  # Dead
color_k = "BrightYellow"   # Wakekill
color_w = "BrightYellow"   # Waking
color_p = "BrightBlue"     # Parked
color_i = "BrightBlack"    # Idle

[style.by_unit]
color_k = "BrightBlue"     # Kilo
color_m = "BrightCyan"     # Mega
color_g = "BrightMagenta"  # Giga
color_t = "BrightRed"      # Tera
color_p = "BrightRed"      # Peta
color_x = "BrightRed"      # Exa

[search]
numeric_search = "Exact"
nonnumeric_search = "Partial"
logic = "And"

[display]
show_self = false
show_thread = false
show_thread_in_tree = true
cut_to_terminal = true
cut_to_pager = false
cut_to_pipe = false
color_mode = "Auto"

[sort]
column = 3  # UsageCpu column (0-indexed)
order = "Descending"

[docker]
path = "unix:///var/run/docker.sock"

[pager]
mode = "Auto"
command = "less"
